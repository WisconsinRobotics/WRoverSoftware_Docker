x-common-config: &common-config
  ipc: host
  network_mode: host
  privileged: true
  environment:
    - DISPLAY=${DISPLAY:-:0}
    - QT_X11_NO_MITSHM=1
    - ROS_DOMAIN_ID=42 # For preventing crosstalk over network
    - SSH_AUTH_SOCK=/ssh-agent
  volumes:
    - ./workspace:/workspace
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ~/.gitconfig:/root/.gitconfig:ro
    - ${SSH_AUTH_SOCK}:/ssh-agent
  tty: true
  stdin_open: true

services:
  main:
    <<: *common-config
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.main
    container_name: wrover_main

  sim:
    <<: *common-config
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.sim
    container_name: wrover_sim
    environment:
      - LIBGL_ALWAYS_SOFTWARE=1
      - GALLIUM_DRIVER=llvmpipe

  gui:
    <<: *common-config
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.gui
    container_name: wrover_gui